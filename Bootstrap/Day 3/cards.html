<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cards</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container mt-5">
      <div class="card" style="width: 400px">
        <img
          src="photo-1575936123452-b67c3203c357.jpeg"
          alt=""
          class="card-img card-img-top"
        />
        <div class="card-body">
          <h4 class="card-title">John Doe</h4>
          <p class="card-text">Artist</p>
          <button class="btn btn-primary">Submit</button>
        </div>
      </div>
      <h1>Bottom Card Image</h1>
      <div class="card" style="width: 400px">
        <div class="card-body">
          <h4 class="card-title">John Doe</h4>
          <p class="card-text">Artist</p>
          <button class="btn btn-primary">Submit</button>
        </div>
        <img src="photo-1575936123452-b67c3203c357.jpeg" alt="" class="" />
      </div>
      <h1>Card Image Overlay</h1>
      <div class="card" style="width: 400px">
        <div class="card-img-overlay">
          <h4 class="card-title text-white">John Doe</h4>
          <p class="card-text text-warning">Artist</p>
          <button class="btn btn-primary">Submit</button>
        </div>
        <img src="photo-1575936123452-b67c3203c357.jpeg" alt="" class="" />
      </div>
    </div>
  </body>
</html>
