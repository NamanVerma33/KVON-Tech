<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <title>Forms</title>
  </head>
  <body>
    <h1>Simple Form</h1>
    <div class="container bg-secondary">
      <form action="">
        <div class="mt-3">
          <label for="" class="form-label">Enter the name</label>
          <input
            type="text"
            class="form-control form-control-lg"
            placeholder="Search"
          />
        </div>
        <div class="my-2">
          <label for="" class="form-label">Enter the password</label>
          <input
            type="password"
            class="form-control form-control-sm"
            placeholder="password"
          />
        </div>
        <div class="form-check mt-3 mb-3">
          <input type="checkbox" name="" class="form-check-input" id="" />
          <label for="" class="form-check-label">Checkbox</label>
        </div>
        <div class="form-check mt-3">
          <label for="" class="form-label">Disabled input</label>
          <input type="text" class="form-control" placeholder="disabled" />
        </div>
        <div class="form-check mt-3 mb-3">
          <label for="" class="form-label">Read only input</label>
          <input type="text" class="form-control" placeholder="Read only" />
        </div>
        <div>
          <label for="" class="form-label">Color Picker</label>
          <input type="color" class="form-control form-control-color" />
        </div>

        <select name="" id="" class="form-select form-select-lg mt-3 mb-3">
          <option value="">1</option>
          <option value="">2</option>
          <option value="">3</option>
          <option value="">4</option>
        </select>

        <div class="my-3">
          <label for="" class="form-label">Datalist</label>
          <input class="form-control" list="browsers" id="browser" />
          <datalist id="browsers">
            <option value="Edge"></option>
            <option value="Safari"></option>
            <option value="Chrome"></option>
            <option value=" Brave"></option>
          </datalist>
        </div>
        <button class="btn btn-primary">Submit</button>
      </form>
    </div>
  </body>
</html>
