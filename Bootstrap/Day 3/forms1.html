<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container bg-secondary">
      <form action="">
        <div class="my-2">
          <label for="" class="form-label">Enter your first name</label>
          <input type="text" class="form-control form-control-lg" />
        </div>
        <div class="my-2">
          <label for="" class="form-label">Enter your last name</label>
          <input type="text" class="form-control form-control" />
        </div>
        <div class="my-2">
          <label for="" class="form-label">Enter your password</label>
          <input type="password" class="form-control form-control-sm" />
        </div>
        <div class="form-check my-2">
          <input type="radio" class="form-check-input" name="oprradio" />
          <label for="" class="form-label">Radio 1</label>
        </div>
        <div class="form-check my-2">
          <input
            type="radio"
            class="form-check-input"
            id="radio1"
            name="oprradio"
          />
          <label for="" class="form-label">Radio 2</label>
        </div>
        <div class="form-check my-2">
          <input
            type="radio"
            id="radio2"
            class="form-check-input"
            name="oprradio"
          />
          <label for="" class="form-label">Radio 3</label>
        </div>
        <div class="my-2">
          <input
            type="range"
            name=""
            class="form-range"
            id=""
            min="0"
            max="4"
          />
        </div>

        <div class="form-check"></div>
      </form>
    </div>
  </body>
</html>
