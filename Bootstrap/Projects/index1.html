<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container mt-3 mx-5 p-5">
      <h3 class="h3">Billing address</h3>
      <form action="">
        <div class="row was-validated">
          <div class="col">
            <label for="" class="form-label">First name</label>
            <input type="text" class="form-control" required />
            <div class="valid-feedback">Valid.</div>
            <div class="invalid-feedback">Please fill out this field.</div>
          </div>
          <div class="col">
            <label for="" class="form-label">Last name</label>
            <input type="text" class="form-control" required />
            <div class="valid-feedback">Valid.</div>
            <div class="invalid-feedback">Please fill out this field.</div>
          </div>
        </div>
        <div class="input-group mt-3 was-validated">
          <span class="input-group-text">@</span>
          <input
            type="text"
            class="form-control"
            placeholder="Username"
            required
          />
          <div class="valid-feedback">Valid.</div>
          <div class="invalid-feedback">Please fill out this field.</div>
        </div>
        <div class="mt-3">
          <label for="" class="form-label"
            >Email <span class="text-muted">(Optional)</span></label
          >
          <input
            type="email"
            class="form-control"
            placeholder="you@example.com"
          />
        </div>
        <div class="mt-3">
          <label for="" class="form-label">Address</label>
          <input type="text" class="form-control" placeholder="1234 Main St" />
        </div>
        <div class="mt-3">
          <label for="" class="form-label">Address</label>
          <input
            type="text"
            class="form-control"
            placeholder="Apartment or suite"
          />
        </div>
        <div class="row">
          <div class="col-sm">
            <div class="mt-3">
              <label for="" class="form-label">Country</label>
              <select name="" id="" class="form-control">
                <option value="">Choose..</option>
                <option value="">India</option>
              </select>
            </div>
          </div>
          <div class="col-sm">
            <div class="mt-3">
              <label for="" class="form-label">State</label>
              <select name="" id="" class="form-control">
                <option value="">Choose..</option>
                <option value="">Rajasthan</option>
              </select>
            </div>
          </div>
          <div class="col-sm">
            <div class="mt-3">
              <label for="" class="form-label">Zip</label>
              <input type="text" class="form-control dropdown" />
            </div>
          </div>
        </div>

        <hr class="mx-3" />
        <div class="form-check">
          <label for="" class="form-check-label"
            >Shipping address is the same as my billing address</label
          >
          <input type="checkbox" class="form-check-input" />
        </div>
        <div class="form-check">
          <label for="" class="form-check-label"
            >Save this information for next time</label
          >
          <input type="checkbox" class="form-check-input" />
        </div>
        <hr class="mx-3" />
        <div class="form-check">
          <h4 class="h4">Payment</h4>
          <input type="radio" class="form-check-input" name="optradio" />
          <label for="" class="form-check-label">Credit Card</label>
        </div>
        <div class="form-check">
          <input type="radio" class="form-check-input" name="optradio" />
          <label for="" class="form-check-label">Debit Card</label>
        </div>
        <div class="form-check">
          <input type="radio" class="form-check-input" name="optradio" />
          <label for="" class="form-check-label">PayPal</label>
        </div>
        <!-- <div class="mt-3">
          <label for="" class="form-label">Name on card</label>
          <input type="text" class="form-controls" />
        </div>
        <div class="mt-3">
          <label for="" class="form-label">Credit card number</label>
          <input type="text" class="form-controls" />
        </div> -->
        <div class="row">
          <div class="col">
            <label for="" class="form-label">Name on card</label>
            <input type="text" class="form-control" />
            <label for="" class="form-label text-muted"
              >Full name as displayed on card</label
            >
          </div>
          <div class="col">
            <label for="" class="form-label">Credit card number</label>
            <input type="text" class="form-control" />
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label for="" class="form-label">Expiration</label>
            <input type="text" class="form-control" />
          </div>
          <div class="col">
            <label for="" class="form-label">CVV</label>
            <input type="text" class="form-control" />
          </div>
        </div>
        <hr class="mx-3" />
        <div class="">
          <button class="btn btn-primary p-2 px-5">Continue to checkout</button>
        </div>
      </form>
    </div>
  </body>
</html>
