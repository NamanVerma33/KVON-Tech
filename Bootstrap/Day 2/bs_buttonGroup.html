<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <title>Button Groups</title>
  </head>
  <body>
    <div class="btn-group">
      <button class="btn btn-primary">Submit</button>
      <button class="btn btn-primary">Reset</button>
    </div>

    <div class="btn-group btn-group-lg">
      <button class="btn btn-success">Success 1</button>
      <button class="btn btn-success">Success 2</button>
      <button class="btn btn-success">Success 3</button>
    </div>

    <h1>Vertical Buttons</h1>
    <div class="btn-group btn-group-vertical">
      <button class="btn btn-warning">warning 1</button>
      <button class="btn btn-warning">warning 2</button>
      <button class="btn btn-warning">warning 3</button>
    </div>

    <h1>DropDown Menu in buttons</h1>

          <a href="#" class="dropdown-item">Link 1</a>

    <div class="btn-group">
      <button type="button" class="btn btn-primary">Apple</button>
      <button type="button" class="btn btn-primary">Samsung</button>
      <div class="btn-group">
        <button
          type="button"
          class="btn btn-primary dropdown-toggle"
          data-bs-toggle="dropdown"
        >
          Sony
        </button>
        <div class="dropdown-menu">
          <a class="dropdown-item" href="#">Tablet</a>
          <a class="dropdown-item" href="#">Smartphone</a>
        </div>
      </div>
    </div>
  </body>
</html>
