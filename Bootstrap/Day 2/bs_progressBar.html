<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progress Bar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1>Progress bar</h1>
    <div class="progress">
      <div class="progress-bar" style="width: 30%">30%</div>
    </div>
    <div class="progress mt-2" style="height: 50px">
      <div class="progress-bar bg-success" style="width: 25%">25%</div>
    </div>

    <h1>Striped progress bar</h1>
    <div class="progress">
      <div class="progress-bar progress-bar-striped" style="width: 45%">
        45%
      </div>
    </div>
    <div class="progress mt-5">
      <div class="progress-bar progress-bar-striped bg-dark" style="width: 15%">
        15%
      </div>
    </div>
    <div class="progress mt-5" style="height: 50px">
      <div
        class="progress-bar progress-bar-striped progress-bar-animated bg-warning"
        style="width: 100%"
      >
        100%
      </div>
    </div>

    <h1>Example</h1>
    <div class="progress">
      <div class="progress-bar progress-bar-striped" style="width: 10%">
        First
      </div>
      <div
        class="progress-bar progress-bar-striped progress-bar-animated bg-dark"
        style="width: 23%"
      >
        Second
      </div>
      <div class="progress-bar bg-danger" style="width: 33%">Third</div>
    </div>
  </body>
</html>
