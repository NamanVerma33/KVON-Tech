<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badges</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1>Example heading <span class="badge bg-secondary">New</span></h1>
    <h1>Example heading <span class="badge bg-primary">New</span></h1>
    <h1>Example heading <span class="badge bg-warning">New</span></h1>
    <h1>Example heading <span class="badge bg-dark">New</span></h1>

    <h1 class="bg-success p-2 m-2">Pill Badges</h1>
    <h1 class="badge rounded-pill bg-primary"><span>Primary</span></h1>
    <h1 class="badge rounded-pill bg-secondary"><span>Secondary</span></h1>
    <h1 class="badge rounded-pill bg-info"><span>Information</span></h1>
    <h1 class="badge rounded-pill bg-danger"><span>Warning</span></h1>
    <h1 class="badge rounded-pill bg-light"><span>Light</span></h1>
    <h1 class="badge rounded-pill bg-dark"><span>Dark</span></h1>
    <h1 class="badge rounded-pill bg-success"><span>Success</span></h1>

    <h1>Badge inside an element</h1>
    <button class="btn btn-primary">
      Messages <span class="badge btn-danger">25</span>
    </button>
  </body>
</html>
