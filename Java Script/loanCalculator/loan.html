<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="loan.css" />
  </head>
  <body>
    <div class="container">
      <h1>Loan Calculator</h1>
      <form action="" id="loanform">
        <label for="">Loan Amount</label>
        <input type="number" name="loan" id="loan" min="0" class="input-box" />
        <label for="">Interest Rate(%)</label>
        <input
          type="number"
          name="interest"
          id="interest"
          class="input-box"
          min="0"
        />
        <label for="">Loan Terms(in Months)</label>
        <input
          type="number"
          name="terms"
          id="terms"
          class="input-box"
          min="0"
        />
        <button type="submit" id="button">Calculate</button>
      </form>
      <div id="result"></div>
    </div>
    <script src="loan.js"></script>
  </body>
</html>
